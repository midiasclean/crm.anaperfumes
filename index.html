<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f5f95">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Ana Perfumes · Gestão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Menu lateral -->
    <aside id="drawer" class="drawer" aria-label="Menu principal"></aside>
    <div id="scrim" class="scrim"></div>

    <!-- Área principal -->
    <div class="main">
      <header class="topbar" id="topbar">
        <button class="icon-btn" id="btnLeft" aria-label="Menu"></button>
        <h1 id="title">Pedidos</h1>
        <div class="top-actions" id="actions"></div>
      </header>
      <main id="view" class="view"></main>
    </div>

    <!-- Navegação inferior -->
    <nav class="bottomnav" id="bottomnav">
      <a href="#/dashboard" data-tab="dashboard" aria-label="Painel"></a>
      <a href="#/pedidos" data-tab="pedidos" aria-label="Pedidos"></a>
      <span class="fab-space"></span>
      <a href="#/agenda" data-tab="agenda" aria-label="Agenda"></a>
      <a href="#/financas" data-tab="financas" aria-label="Finanças"></a>
    </nav>
    <button class="fab" id="fab" aria-label="Adicionar">+</button>

    <!-- Modal / folha inferior -->
    <div class="modal" id="modal" aria-hidden="true">
      <div class="sheet" role="dialog" aria-modal="true"></div>
    </div>
    <div class="toast" id="toast"></div>
  </div>

  <!-- Área de impressão (recibos e orçamentos) -->
  <div id="print"></div>

  <script src="app.js"></script>
</body>
</html>
